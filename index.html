<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Adventure - Music & Sidekick Update</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #87CEEB; overflow: hidden; font-family: 'Verdana', sans-serif; color: #fff; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* Sunrays Effect */
        #fx-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%);
            z-index: 10;
        }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .screen { display: none; flex-direction: column; align-items: center; text-align: center; background: #654321; padding: 40px; border: 6px solid #3e2723; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .active { display: flex; }
        
        h1 { font-size: 3.5rem; margin-bottom: 10px; color: #FFD700; text-shadow: 2px 2px 0px #8B4513, 4px 4px 0px #3e2723; }
        h2 { font-size: 2rem; margin-bottom: 20px; color: #fff; }
        .tagline { color: #f4d03f; margin-bottom: 30px; font-weight: bold; }
        
        button {
            background: #4CAF50; border: 4px solid #2E7D32; color: #fff; padding: 12px 24px; font-size: 1.2rem; font-weight: bold;
            margin: 10px; cursor: pointer; transition: transform 0.1s; width: 250px; border-radius: 10px;
        }
        button:hover { transform: scale(1.05); background: #45a049; }

        #hud { position: absolute; top: 20px; left: 20px; width: calc(100% - 40px); display: none; justify-content: space-between; z-index: 15; font-size: 1.4rem; font-weight: bold; pointer-events: none; }
        
        .wood-board {
            background: #8B4513; border: 4px solid #5C4033; padding: 10px 20px; border-radius: 10px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.3); text-shadow: 1px 1px 2px #000;
        }
        
        #level-alert {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 3rem; font-weight: bold; color: #FFD700;
            text-shadow: 3px 3px 0px #3e2723; opacity: 0; transition: opacity 0.5s; z-index: 15; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="fx-layer"></div>
    <div id="level-alert">LEVEL COMPLETE!</div>
    
    <div id="hud">
        <div class="wood-board">
            <div style="color: #ff6b6b;">❤️ Lives: <span id="hud-lives">3</span></div>
            <div style="color: #FFD700; margin-top: 8px;">🪙 Coins: <span id="hud-coins">0</span></div>
        </div>
        <div class="wood-board" style="text-align: right;">
            <div>Level: <span id="hud-level">1</span></div>
        </div>
    </div>

    <div id="ui-layer">
        <div id="menu-main" class="screen active">
            <h1>FOREST<br>ADVENTURE</h1>
            <div class="tagline">Explore, get power-ups, and defeat the monsters!</div>
            <button onclick="Game.start()">Start Game</button>
            <button onclick="alert('Controls:\nA/D or Arrows : Move\nSpace : Jump\nF : Shoot Fireball (Requires Flower)\nEsc : Pause')">How to Play</button>
        </div>

        <div id="menu-pause" class="screen">
            <h2>PAUSED</h2>
            <button onclick="Game.resume()">Resume</button>
            <button onclick="Game.restartLevel()">Restart Level</button>
            <button onclick="Game.toMainMenu()">Quit</button>
        </div>

        <div id="menu-dead" class="screen">
            <h2 style="color: #ff4757;">GAME OVER</h2>
            <p style="margin-bottom: 20px; color:#ddd;">You ran out of lives!</p>
            <button onclick="Game.start()">Try Again</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

// --- AUDIO & MUSIC SYSTEM ---
const AudioEngine = {
    ctx: null, masterGain: null,
    
    // Background Music Data (C Major & F Major arpeggios)
    bgmNotes: [261.63, 329.63, 392.00, 329.63, 349.23, 440.00, 523.25, 440.00],
    bgmIndex: 0,
    bgmTimer: 0,

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.15;
            this.masterGain.connect(this.ctx.destination);
        }
        if(this.ctx.state === 'suspended') this.ctx.resume();
    },

    updateBGM(dt) {
        if (!this.ctx || Game.state !== 'PLAY') return;
        this.bgmTimer -= dt;
        if (this.bgmTimer <= 0) {
            let note = this.bgmNotes[this.bgmIndex];
            this.playTone(note, 'triangle', 0.25, 0.05); // Quiet background instrument
            this.bgmIndex = (this.bgmIndex + 1) % this.bgmNotes.length;
            this.bgmTimer = 0.25; // Play 4 notes per second
        }
    },

    playTone(freq, type, duration, vol) {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
    },
    playJump() { this.playTone(300, 'sine', 0.3, 0.5); },
    playShoot() { this.playTone(600, 'square', 0.1, 0.4); },
    playPowerUp() { 
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.2);
        osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(); osc.stop(this.ctx.currentTime + 0.4);
    },
    playCoin() { 
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1000, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1500, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(); osc.stop(this.ctx.currentTime + 0.3);
    },
    playStomp() { this.playTone(200, 'square', 0.2, 0.5); },
    playHurt() { this.playTone(150, 'sawtooth', 0.4, 0.6); }
};

// --- INPUT ---
const Input = {
    keys: {},
    init() {
        window.addEventListener('keydown', e => {
            this.keys[e.code] = true;
            if(e.code === 'Escape') Game.togglePause();
        });
        window.addEventListener('keyup', e => this.keys[e.code] = false);
    },
    isDown(code) { return this.keys[code] === true; }
};
Input.init();

// --- ENTITIES ---
class Entity {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
        this.vx = 0; this.vy = 0;
    }
    get cx() { return this.x + this.w/2; }
    get cy() { return this.y + this.h/2; }
}

const Player = new (class extends Entity {
    constructor() {
        super(100, 100, 36, 60);
        this.speed = 300;
        this.jumpForce = -700; 
        this.dead = false;
        this.grounded = false;
        this.facing = 1; 
        this.invincibleTimer = 0;
        this.hasFirepower = false; 
        this.shootTimer = 0;
    }
    reset(x, y) {
        this.x = x; this.y = y; this.vx = 0; this.vy = 0; 
        this.dead = false; this.facing = 1; this.invincibleTimer = 2.0; 
        this.hasFirepower = false;
    }
    update(dt) {
        if(this.dead) return;
        if(this.invincibleTimer > 0) this.invincibleTimer -= dt;
        if(this.shootTimer > 0) this.shootTimer -= dt;

        let move = 0;
        if(Input.isDown('KeyA') || Input.isDown('ArrowLeft')) { move -= 1; this.facing = -1; }
        if(Input.isDown('KeyD') || Input.isDown('ArrowRight')) { move += 1; this.facing = 1; }
        
        this.vx = move * this.speed;
        
        if((Input.isDown('Space') || Input.isDown('ArrowUp')) && this.grounded) {
            this.vy = this.jumpForce;
            this.grounded = false;
            AudioEngine.playJump();
        }

        // Shooting Logic
        if(this.hasFirepower && Input.isDown('KeyF') && this.shootTimer <= 0) {
            Level.projectiles.push({
                x: this.facing === 1 ? this.x + this.w : this.x - 15,
                y: this.y + 20,
                w: 15, h: 15,
                vx: this.facing * 600,
                active: true
            });
            this.shootTimer = 0.3; 
            AudioEngine.playShoot();
        }

        this.vy += 1800 * dt; 
        if(this.vy > 900) this.vy = 900;

        this.x += this.vx * dt;
        this.resolveCollisions(true);

        this.y += this.vy * dt;
        this.grounded = false;
        this.resolveCollisions(false);
        
        if(this.y > H + 200) Game.takeDamage(); 
    }
    resolveCollisions(isX) {
        for(let block of Level.blocks) {
            if(this.x < block.x + block.w && this.x + this.w > block.x &&
               this.y < block.y + block.h && this.y + this.h > block.y) {
                if(isX) {
                    if(this.vx > 0) this.x = block.x - this.w;
                    else this.x = block.x + block.w;
                    this.vx = 0;
                } else {
                    if(this.vy > 0) { this.y = block.y - this.h; this.grounded = true; } 
                    else { this.y = block.y + block.h; }
                    this.vy = 0;
                }
            }
        }
    }
    draw(ctx) {
        if(this.dead) return;
        if(this.invincibleTimer > 0 && Math.floor(this.invincibleTimer * 10) % 2 === 0) return; 

        ctx.save();
        ctx.translate(this.cx, this.cy);
        ctx.scale(this.facing, 1);
        ctx.translate(-this.w/2, -this.h/2);

        ctx.fillStyle = '#8B4513'; ctx.fillRect(20, 20, 4, 30); // Back Arm
        
        // Tunic
        ctx.fillStyle = this.hasFirepower ? '#FF4500' : '#228B22'; 
        ctx.fillRect(8, 20, 20, 19); 
        
        // Belt
        ctx.fillStyle = '#654321'; ctx.fillRect(8, 35, 20, 4); 
        ctx.fillStyle = '#FFD700'; ctx.fillRect(14, 34, 6, 6);

        // --- NEW: SHORTS & DETAILED LEGS ---
        ctx.fillStyle = '#1E90FF'; // Dodger Blue Shorts
        ctx.fillRect(8, 39, 20, 7); // Main shorts body
        ctx.fillRect(10, 46, 6, 4); // Left leg shorts
        ctx.fillRect(20, 46, 6, 4); // Right leg shorts
        
        // Skin Legs
        ctx.fillStyle = '#FFDAB9'; 
        ctx.fillRect(10, 50, 6, 6); 
        ctx.fillRect(20, 50, 6, 6); 
        
        // Brown Shoes
        ctx.fillStyle = '#8B4513'; 
        ctx.fillRect(8, 56, 8, 4); 
        ctx.fillRect(18, 56, 8, 4); 

        // Head
        ctx.fillStyle = '#FFDAB9'; ctx.beginPath(); ctx.arc(18, 10, 10, 0, Math.PI*2); ctx.fill(); 
        ctx.fillStyle = '#000'; ctx.fillRect(22, 6, 2, 4); // Eye

        // Hat
        ctx.fillStyle = this.hasFirepower ? '#FF4500' : '#228B22'; 
        ctx.beginPath(); ctx.moveTo(4, 8); ctx.lineTo(18, -4); ctx.lineTo(30, 8); ctx.fill();
        ctx.fillStyle = '#FF0000'; ctx.beginPath(); ctx.moveTo(10, 2); ctx.lineTo(2, -10); ctx.lineTo(6, -6); ctx.fill();

        ctx.restore();
    }
})();

// --- NEW: SIDEKICK (Fairy) ---
const Sidekick = {
    x: 100, y: 100,
    update(dt) {
        if (Player.dead) return;
        // Follow behind the player
        let targetX = Player.facing === 1 ? Player.x - 25 : Player.x + Player.w + 25;
        // Hover above
        let targetY = Player.y - 10 + Math.sin(Date.now() / 250) * 12;
        
        // Smooth easing towards target
        this.x += (targetX - this.x) * 4 * dt;
        this.y += (targetY - this.y) * 4 * dt;
    },
    draw(ctx) {
        if (Player.dead) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Glowing Orb Body
        ctx.fillStyle = '#FFFF99'; 
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
        
        // Inner Glow
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fill();

        // Fluttering Wings
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        let wingFlap = Math.sin(Date.now() / 40) * 5;
        
        // Left Wing
        ctx.beginPath(); 
        ctx.ellipse(-4, -2, 6, 2, -Math.PI/6 + wingFlap/10, 0, Math.PI*2); 
        ctx.fill();
        
        // Right Wing
        ctx.beginPath(); 
        ctx.ellipse(4, -2, 6, 2, Math.PI/6 - wingFlap/10, 0, Math.PI*2); 
        ctx.fill();

        ctx.restore();
    }
};

// --- LEVEL SYSTEM ---
const Level = {
    current: 1, width: 3000,
    blocks: [], coins: [], monsters: [], scenery: [], powerups: [], projectiles: [],
    
    load(levelNum) {
        this.current = levelNum;
        this.blocks = []; this.coins = []; this.monsters = []; 
        this.scenery = []; this.powerups = []; this.projectiles = [];
        this.generateGeometry(levelNum);
    },

    generateGeometry(level) {
        this.width = 2500 + (level * 500);
        
        this.blocks.push({x: -200, y: 550, w: 800, h: 500});
        this.blocks.push({x: -200, y: -500, w: 100, h: 1600}); 
        
        for(let i=0; i<this.width/300; i++) {
            this.scenery.push({
                x: i * 350 + Math.random() * 100, 
                y: 500, type: 'tree', size: Math.random() * 0.5 + 0.8
            });
        }

        let cx = 600;
        for(let i=0; i<6 + level; i++) {
            let gap = Math.random() * 150 + 100;
            let width = Math.random() * 300 + 200;
            let height = 550 - (Math.random() * 150);
            
            this.blocks.push({x: cx, y: height, w: width, h: H});
            
            for(let j=0; j<3; j++) {
                this.coins.push({x: cx + (width/4)*(j+1), y: height - 80 - (Math.sin(j)*30), w: 20, h: 20, collected: false});
            }
            
            if(Math.random() > 0.7 && !Player.hasFirepower) {
                this.powerups.push({ x: cx + width/2, y: height - 40, w: 20, h: 20, active: true });
            }
            
            if(Math.random() > 0.4) {
                this.monsters.push({
                    type: 'ground', x: cx + width/3, y: height - 30, w: 30, h: 30,
                    vx: 100, minX: cx, maxX: cx + width - 30, active: true
                });
            }

            if(Math.random() > 0.6) {
                this.monsters.push({
                    type: 'flying', x: cx + width/2, y: height - 150, w: 40, h: 25,
                    vx: -80, baseY: height - 150, active: true
                });
            }
            cx += width + gap;
        }

        this.blocks.push({x: cx, y: 550, w: 800, h: 500});
        this.scenery.push({x: cx + 300, y: 550, type: 'goal'});
    },

    update(dt) {
        // Projectiles
        for(let p of this.projectiles) {
            if(!p.active) continue;
            p.x += p.vx * dt;
            
            for(let b of this.blocks) {
                if(p.x < b.x + b.w && p.x + p.w > b.x && p.y < b.y + b.h && p.y + p.h > b.y) {
                    p.active = false; break;
                }
            }
            
            for(let m of this.monsters) {
                if(m.active && p.x < m.x + m.w && p.x + p.w > m.x && p.y < m.y + m.h && p.y + p.h > m.y) {
                    m.active = false;
                    p.active = false;
                    AudioEngine.playStomp();
                    break;
                }
            }
        }

        // Powerups
        for(let p of this.powerups) {
            if(p.active && Player.x < p.x + p.w && Player.x + Player.w > p.x && Player.y < p.y + p.h && Player.y + Player.h > p.y) {
                p.active = false;
                Player.hasFirepower = true;
                AudioEngine.playPowerUp();
            }
        }

        // Monsters
        for(let m of this.monsters) {
            if(!m.active) continue;
            
            if(m.type === 'ground') {
                m.x += m.vx * dt;
                if(m.x < m.minX) { m.x = m.minX; m.vx *= -1; }
                if(m.x > m.maxX) { m.x = m.maxX; m.vx *= -1; }
            } else if (m.type === 'flying') {
                m.x += m.vx * dt;
                m.y = m.baseY + Math.sin(Date.now() / 200) * 50; 
            }

            if(Player.invincibleTimer <= 0 && Player.x < m.x + m.w && Player.x + Player.w > m.x && Player.y < m.y + m.h && Player.y + Player.h > m.y) {
                if(Player.vy > 0 && Player.y + Player.h - Player.vy * dt < m.y + 15) {
                    m.active = false;
                    Player.vy = Player.jumpForce * 0.8; 
                    AudioEngine.playStomp();
                } else {
                    Game.takeDamage();
                }
            }
        }

        // Coins
        for(let c of this.coins) {
            if(!c.collected && Player.x < c.x + c.w && Player.x + Player.w > c.x && Player.y < c.y + c.h && Player.y + Player.h > c.y) {
                c.collected = true; Game.coins++; AudioEngine.playCoin(); Game.updateHUD();
            }
        }

        let goal = this.scenery.find(s => s.type === 'goal');
        if(goal && Player.x > goal.x) Game.levelComplete();
    },

    draw(ctx, camera) {
        ctx.fillStyle = '#6495ED'; ctx.fillRect(0, H-300, W, 300);
        ctx.fillStyle = '#3CB371'; 
        for(let i=0; i<10; i++) {
            let px = ((i * 500) - (camera.x * 0.2)) % 3000;
            if(px < -500) px += 3000;
            ctx.beginPath(); ctx.arc(px + 250, H - 100, 300, Math.PI, 0); ctx.fill();
        }

        for(let s of this.scenery) {
            let sx = s.x - camera.x;
            if(sx < -200 || sx > W + 200) continue;
            
            if(s.type === 'tree') {
                ctx.save(); ctx.translate(sx, s.y); ctx.scale(s.size, s.size);
                ctx.fillStyle = '#8B4513'; ctx.fillRect(-20, -150, 40, 150);
                ctx.fillStyle = '#006400';
                ctx.beginPath(); ctx.arc(0, -150, 70, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(-40, -100, 50, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(40, -100, 50, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            } else if (s.type === 'goal') {
                ctx.fillStyle = '#8B4513'; ctx.fillRect(sx, s.y - 100, 10, 100);
                ctx.fillStyle = '#cd853f'; ctx.fillRect(sx - 40, s.y - 120, 90, 50);
                ctx.fillStyle = '#000'; ctx.font = '16px Verdana'; ctx.fillText("GOAL", sx - 25, s.y - 90);
            }
        }

        for(let b of this.blocks) {
            let bx = b.x - camera.x;
            if(bx + b.w < 0 || bx > W) continue; 
            ctx.fillStyle = '#654321'; ctx.fillRect(bx, b.y, b.w, b.h);
            ctx.fillStyle = '#228B22'; ctx.fillRect(bx, b.y, b.w, 15);
            ctx.fillStyle = '#8B4513';
            for(let i=0; i<b.w/40; i++) {
                ctx.fillRect(bx + (i*40) + 10, b.y + 30, 8, 8);
                ctx.fillRect(bx + (i*40) + 30, b.y + 60, 8, 8);
            }
        }

        for(let c of this.coins) {
            if(c.collected) continue;
            let cx = c.x - camera.x;
            ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(cx + 10, c.y + 10, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#DAA520'; ctx.beginPath(); ctx.arc(cx + 10, c.y + 10, 8, 0, Math.PI*2); ctx.fill();
        }

        for(let p of this.powerups) {
            if(!p.active) continue;
            let px = p.x - camera.x;
            ctx.fillStyle = '#FF0000'; ctx.beginPath(); ctx.arc(px + 10, p.y + 10, 10, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#FFFF00'; ctx.beginPath(); ctx.arc(px + 10, p.y + 10, 4, 0, Math.PI*2); ctx.fill();
        }

        for(let p of this.projectiles) {
            if(!p.active) continue;
            let px = p.x - camera.x;
            ctx.fillStyle = '#FFA500'; ctx.beginPath(); ctx.arc(px + p.w/2, p.y + p.h/2, p.w/2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#FF4500'; ctx.beginPath(); ctx.arc(px + p.w/2, p.y + p.h/2, p.w/4, 0, Math.PI*2); ctx.fill();
        }

        for(let m of this.monsters) {
            if(!m.active) continue;
            let mx = m.x - camera.x;
            
            if(m.type === 'ground') {
                ctx.fillStyle = '#A0522D';
                ctx.beginPath(); ctx.arc(mx + 15, m.y + 15, 15, Math.PI, 0); ctx.fill();
                ctx.fillRect(mx, m.y + 15, 30, 15); 
                
                ctx.fillStyle = '#FFF'; 
                let lookDir = m.vx > 0 ? 5 : -5;
                ctx.fillRect(mx + 8 + lookDir, m.y + 10, 4, 4);
                ctx.fillRect(mx + 18 + lookDir, m.y + 10, 4, 4);
                
                ctx.fillStyle = '#000';
                let walkOffset = Math.sin(Date.now() / 100) * 3;
                ctx.fillRect(mx + 5, m.y + 26 - walkOffset, 6, 6);
                ctx.fillRect(mx + 19, m.y + 26 + walkOffset, 6, 6);
            } else if(m.type === 'flying') {
                ctx.fillStyle = '#4169E1';
                ctx.beginPath(); ctx.arc(mx + 20, m.y + 15, 12, 0, Math.PI*2); ctx.fill(); 
                
                let wingOffset = Math.sin(Date.now() / 50) * 15;
                ctx.beginPath(); ctx.moveTo(mx + 5, m.y + 10); ctx.lineTo(mx - 15, m.y + 10 + wingOffset); ctx.lineTo(mx, m.y + 20); ctx.fill();
                ctx.beginPath(); ctx.moveTo(mx + 35, m.y + 10); ctx.lineTo(mx + 55, m.y + 10 + wingOffset); ctx.lineTo(mx + 40, m.y + 20); ctx.fill();
                
                ctx.fillStyle = '#FFF';
                ctx.fillRect(mx + 10, m.y + 10, 4, 4);
                ctx.fillRect(mx + 22, m.y + 10, 4, 4);
            }
        }
    }
};

// --- CAMERA ---
const Camera = {
    x: 0, y: 0,
    update(dt) {
        let targetX = Player.cx - W/3; 
        if(targetX < 0) targetX = 0;
        this.x += (targetX - this.x) * 8 * dt;
    }
};

// --- GAME MANAGER ---
const Game = {
    state: 'MENU', 
    lastTime: 0, coins: 0, lives: 3,
    loadingLevel: false,

    init() { requestAnimationFrame(t => this.loop(t)); },

    showScreen(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        if(id) document.getElementById(id).classList.add('active');
        document.getElementById('hud').style.display = (this.state === 'PLAY' || this.state === 'PAUSE') ? 'flex' : 'none';
    },

    start() {
        AudioEngine.init();
        this.coins = 0; this.lives = 3;
        Level.load(1); Player.reset(100, 400);
        Sidekick.x = 100; Sidekick.y = 350; // Initialize sidekick position
        this.state = 'PLAY'; this.showScreen(null);
        this.lastTime = performance.now(); this.updateHUD();
    },

    takeDamage() {
        if(Player.invincibleTimer > 0) return;
        AudioEngine.playHurt();
        this.lives--;
        Player.hasFirepower = false; 
        this.updateHUD();
        
        if(this.lives <= 0) {
            Player.dead = true; this.state = 'DEAD';
            setTimeout(() => { if(this.state === 'DEAD') this.showScreen('menu-dead'); }, 500);
        } else {
            Player.reset(100, 400); 
            Sidekick.x = 100; Sidekick.y = 350;
            Camera.x = 0;
        }
    },

    togglePause() {
        if(this.state === 'PLAY') { this.state = 'PAUSE'; this.showScreen('menu-pause'); } 
        else if (this.state === 'PAUSE') this.resume();
    },

    resume() { this.state = 'PLAY'; this.lastTime = performance.now(); this.showScreen(null); },
    restartLevel() { Level.load(Level.current); Player.reset(100, 400); Sidekick.x = 100; Sidekick.y = 350; Camera.x = 0; this.resume(); },
    toMainMenu() { this.state = 'MENU'; this.showScreen('menu-main'); },

    levelComplete() {
        if(this.loadingLevel) return;
        this.loadingLevel = true; AudioEngine.playCoin(); 
        
        let alert = document.getElementById('level-alert'); alert.style.opacity = 1;
        
        setTimeout(() => {
            alert.style.opacity = 0; Level.load(Level.current + 1); Player.reset(100, 400);
            Sidekick.x = 100; Sidekick.y = 350;
            Camera.x = 0; this.loadingLevel = false; this.updateHUD();
        }, 2000);
    },

    updateHUD() {
        document.getElementById('hud-lives').innerText = this.lives;
        document.getElementById('hud-coins').innerText = this.coins;
        document.getElementById('hud-level').innerText = Level.current;
    },

    loop(timestamp) {
        let dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;
        if(dt > 0.1) dt = 0.1; 

        if(this.state === 'PLAY' && !this.loadingLevel) {
            Player.update(dt); 
            Sidekick.update(dt); // Update Sidekick
            Level.update(dt); 
            Camera.update(dt);
            AudioEngine.updateBGM(dt); // Update Background Music
        }
        this.render();
        requestAnimationFrame(t => this.loop(t));
    },

    render() {
        ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, W, H);
        if(this.state === 'MENU') return;

        ctx.save();
        Level.draw(ctx, Camera);
        ctx.translate(-Camera.x, 0); 
        Player.draw(ctx);
        Sidekick.draw(ctx); // Draw Sidekick
        ctx.restore();
    }
};

window.onload = () => Game.init();
</script>
